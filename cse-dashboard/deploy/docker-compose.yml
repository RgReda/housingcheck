version: "3.9"
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: ../.env.example
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:4173"
